<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compás — Tango DJ Player</title>
<!-- Fonts are self-hosted and bundled via @fontsource-variable (imported in
     entries/main.jsx) so the app needs no network to render its typography. -->
<link rel="stylesheet" href="./styles.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #root { height: 100%; }
</style>
<script>
  // Apply the saved theme (default: dark) before first paint, so launch never
  // flashes the wrong background. React re-applies the same value once mounted.
  try { document.documentElement.dataset.theme = localStorage.getItem("compas.theme") || "dark"; } catch (e) {}
  // The saved text size is applied even earlier — by the preload, via native page
  // zoom — so there's nothing to seed here.
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./entries/main.jsx"></script>
</body>
</html>
