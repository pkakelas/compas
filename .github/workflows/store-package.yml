name: Store package

# Builds the Microsoft Store package for every release tag (or on demand) and
# submits it to the Store straight from here, so nothing large is uploaded by
# hand. Kept out of the Release workflow on purpose: a packaging or Store
# failure here must not break a release or its update metadata.
#
# Submitting needs Partner Center access: the AZURE_AD_TENANT_ID,
# AZURE_AD_APPLICATION_CLIENT_ID, AZURE_AD_APPLICATION_SECRET and SELLER_ID repo
# secrets (an Entra app added in Partner Center with the Manager role) and the
# STORE_PRODUCT_ID repo variable. Without them the packages are only built and
# attached to the run, as before.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  appx:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package for the Store
        shell: bash
        env:
          # Store identity from Partner Center → Product identity. Not secret,
          # so these are repo variables. See appxOptions in electron-builder.mjs.
          APPX_IDENTITY_NAME: ${{ vars.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ vars.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.APPX_PUBLISHER_DISPLAY_NAME }}
          APPX_DISPLAY_NAME: ${{ vars.APPX_DISPLAY_NAME }}
        run: |
          if [ -z "$APPX_IDENTITY_NAME" ] || [ -z "$APPX_PUBLISHER" ] || [ -z "$APPX_PUBLISHER_DISPLAY_NAME" ]; then
            echo "::error::Set the APPX_IDENTITY_NAME, APPX_PUBLISHER and APPX_PUBLISHER_DISPLAY_NAME repo variables first."
            exit 1
          fi
          pnpm exec electron-builder build --config electron-builder.mjs --win appx --x64 --arm64 --publish never

      # The Store tool takes a single file, so both architectures go into one
      # bundle. Once the Store has published a bundle, every later submission
      # has to be a bundle too — which this always is.
      - name: Bundle both architectures
        id: bundle
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } |
            Select-Object -Last 1
          if (-not $makeappx) { Write-Output "::error::makeappx.exe not found in the Windows SDK."; exit 1 }
          New-Item -ItemType Directory -Force dist\bundle | Out-Null
          Copy-Item dist\*.appx dist\bundle\
          $bundle = "dist\Compas-$version.msixbundle"
          & $makeappx.FullName bundle /d dist\bundle /p $bundle /bv "$version.0" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$bundle" >> $env:GITHUB_OUTPUT

      # Each run's packages are ~750MB, so keep them only briefly — at the
      # default 90 days a handful of releases fills the repo's artifact quota.
      # A failed upload (quota, outage) must not stop the Store submission.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: store-packages
          path: |
            dist/*.appx
            dist/*.msixbundle
          if-no-files-found: error
          retention-days: 3

      - name: Check Partner Center access
        id: store
        shell: bash
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          if [ -n "$TENANT_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$SELLER_ID" ] && [ -n "$PRODUCT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Partner Center access isn't set up, so the packages were built but not submitted."
          fi

      - name: Setup Microsoft Store Developer CLI
        if: steps.store.outputs.ready == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4

      # Starts a new submission from the last published one with this bundle in
      # it and submits it for certification, waiting only for Partner Center to
      # accept it, not for certification itself. There is no draft mode: the
      # Store only takes in an uploaded package when the submission is
      # committed. A draft started by hand in Partner Center blocks this step
      # (the API may only replace submissions it created), so delete it first.
      - name: Submit to the Store
        if: steps.store.outputs.ready == 'true'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore publish $env:BUNDLE --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
